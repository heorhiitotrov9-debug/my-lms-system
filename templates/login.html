<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід у LMS ВВНЗ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1d20; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #212529; border: 1px solid #343a40; border-radius: 12px; width: 380px; }
        .btn-primary { background-color: #0d6efd; border: none; }
    </style>
</head>
<body>
    <div class="card p-4 shadow-lg">
        <h3 class="text-center mb-4">Вхід у LMS</h3>
        
        {% if error %}
            <div class="alert alert-danger p-2 text-center" style="font-size: 0.9rem;">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">Email / Логін</label>
                <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required placeholder="user@lms.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required placeholder="••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Увійти</button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary text-secondary style="font-size: 0.8rem;">
            <strong>Тестові акаунти (пароль: 123):</strong><br>
            • Admin: <code>admin@lms.com</code><br>
            • Викладач: <code>teacher@lms.com</code><br>
            • Курсант: <code>student@lms.com</code>
        </div>
    </div>
</body>
</html>
