<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Складання тесту — Захищений режим</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Захист від виділення тексту */
        body { 
            background: #121212; 
            color: #e0e0e0; 
            user-select: none; 
            -webkit-user-select: none; 
            -moz-user-select: none;
        }
        .card { background: #1e1e1e; border: 1px solid #2d2d2d; }
        .blur-screen { filter: blur(15px); pointer-events: none; }
    </style>
</head>
<body class="p-4" id="test-body">
    <div class="container col-md-6">
        <div class="card p-4 shadow">
            <div class="border-bottom border-secondary pb-3 mb-3">
                <span class="badge bg-info text-dark mb-1">{{ test.subject }}</span>
                <h3 class="text-white m-0">{{ test.title }}</h3>
                <small class="text-muted">Курсант: {{ user.name }}</small>
            </div>

            <form action="/student/submit-test/{{ test.id }}" method="post" id="test-form">
                {% for q in questions %}
                <div class="mb-4">
                    <h5 class="text-warning mb-3">Питання {{ loop.index }}: {{ q.text }}</h5>
                    
                    {% for opt_key, opt_value in q.shuffled_options %}
                    <div class="form-check p-3 bg-dark border border-secondary rounded mb-2">
                        <input class="form-check-input ms-1 me-2" type="radio" name="question_{{ q.id }}" value="{{ opt_key }}" id="q_{{ q.id }}_{{ opt_key }}" required>
                        <label class="form-check-label text-white w-100" for="q_{{ q.id }}_{{ opt_key }}">
                            {{ opt_value }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-success w-100 py-2 mt-3">Завершити та Відправити</button>
            </form>
        </div>
    </div>

    <!-- JS-скрипти захисту -->
    <script>
        // 1. Блокування ПКМ (контекстного меню)
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Блокування гарячих клавіш (Ctrl+C, Ctrl+P, PrintScreen, F12)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'p' || e.key === 'P' || e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
            }
            if (e.key === 'F12' || e.key === 'PrintScreen') {
                e.preventDefault();
            }
        });

        // 3. Розмиття екрану при зміні вкладки/вікна (анти-скріншот та перемикання)
        window.addEventListener('blur', () => {
            document.getElementById('test-body').classList.add('blur-screen');
        });
        window.addEventListener('focus', () => {
            document.getElementById('test-body').classList.remove('blur-screen');
        });
    </script>
</body>
</html>
